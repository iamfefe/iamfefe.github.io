<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>GoGo421 搞怪版｜丙級學科刷題機</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="arcade">
<div id="fx-bg" aria-hidden="true"></div>

<header>
  <div class="brand nb-box tilt-r"><span class="logo wob">🚀</span>
    <div><b>GoGo421</b><small>電軟丙級刷題機</small></div>
  </div>
  <div class="hbtns">
    <button id="btn-sound" class="icon nb-box" title="音效">🔊</button>
    <button id="btn-motion" class="icon nb-box" title="減少動畫">✨</button>
  </div>
</header>

<main>
<!-- 首頁 -->
<section id="v-home" class="view on">
  <div class="card big nb-box nb-hero" id="hero">
    <div class="hello">
      <div><h2 id="hi-name">丙級到手，來踢館啦！</h2><p class="sub" id="hi-sub">今天也是猜 C 大師？🎯</p></div>
    </div>
    <p class="due nb-box tilt-l" id="due-badge"></p>
    <h3 class="hh">選一把武器</h3>
    <div class="modes">
      <button class="mode nb-box tilt-l" data-m="review"><span class="mico">📚</span>分類複習<small>挑科目欺負，答錯當練習</small></button>
      <button class="mode nb-box" data-m="daily"><span class="mico">📅</span>每日錯題<small>到期的債今天總決算</small></button>
      <button class="mode hot nb-box tilt-r" data-m="quiz"><span class="mico">⚡</span>模擬測驗<small>50 題正面对決，輸了請喝飲</small></button>
    </div>
    <h3 class="hh">選戰場（科目）</h3>
    <div class="chips" id="subj-chips"></div>
    <div id="wi-row" class="hidden">
      <h3 class="hh">挑關卡（工作項目）</h3>
      <div class="chips" id="wi-chips"></div>
    </div>
    <div id="part-row" class="hidden">
      <h3 class="hh">再切一小塊</h3>
      <div class="chips" id="part-chips"></div>
    </div>
    <h3 class="hh">要幾題？</h3>
    <div class="chips" id="cnt-chips"></div>
    <div class="row startrow" style="margin-top:16px">
      <button class="btn main nb-box" id="btn-go"><span class="rk">🚀</span> 開始！<span class="rk">💥</span></button>
      <span id="monster" title="打瞌睡中…你選 50 題試試">😴💤</span>
      <button class="btn ghost nb-box" id="btn-wb">📕 錯題本</button>
      <button class="btn ghost nb-run" id="btn-clear"><span class="broom">🧹</span>清空錯題本</button>
    </div>
    <p class="sub nb-tiny" style="margin-top:12px">錯題存在這台裝置的瀏覽器裡——換了手機就重來，快取被清掉可別哭哭喔～ 🥲</p>
  </div>
</section>

<!-- 答題 -->
<section id="v-quiz" class="view">
  <div class="card nb-box">
    <div class="qbar">
      <span id="q-phase" class="badge nb-box">基本題</span>
      <span id="q-prog">1 / 50</span>
      <span id="q-timer" class="timer nb-box">⏱ 0:00</span>
    </div>
    <div class="progbar nb-box"><div id="q-fill"></div></div>
    <div id="q-stem" class="stem"></div>
    <div id="q-opts" class="opts"></div>
    <div id="q-feed" class="feed hidden"></div>
    <div class="row end">
      <button class="btn ghost nb-box" id="btn-quit">溜了溜了 🏃</button>
      <button class="btn main nb-box hidden" id="btn-next">下一題 ➜</button>
    </div>
  </div>
</section>

<!-- 結算 -->
<section id="v-result" class="view">
  <div class="card big center nb-box">
    <div id="r-emoji" class="emoji wob"></div>
    <h2 id="r-title"></h2>
    <div class="score nb-box" id="r-score"></div>
    <div class="stats" id="r-stats"></div>
    <div class="row" style="justify-content:center">
      <button class="btn main nb-box" id="btn-again">再衝一輪 🔁</button>
      <button class="btn ghost nb-box" id="btn-rhome">當我沒來 🚪</button>
    </div>
  </div>
</section>

<!-- 錯題本 -->
<section id="v-wb" class="view">
  <div class="card big nb-box">
    <h2>📕 債主名單（錯題本）</h2>
    <p class="sub" id="wb-sum"></p>
    <div id="wb-list"></div>
    <button class="btn ghost nb-box" id="btn-wb-back">回首頁</button>
  </div>
</section>
</main>

<div id="lightbox" class="hidden"><img id="lb-img" alt="放大圖片"><div class="lb-close">點任何地方關閉</div></div>
<canvas id="confetti"></canvas>
<div id="toast" class="nb-box"></div>
<script src="data/data.js"></script>
<script src="app.js"></script>
<script src="fun.js"></script>
</body>
</html>
